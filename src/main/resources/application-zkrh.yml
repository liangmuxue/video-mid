# 宇视对接：开发 mock，联调改 live。mock 夹具见 resources/mock 与 *.mock 包，上线可整段删除
uniview:
  data-source: live
  mock:
    preview-base-url: http://119.3.161.125:7094/live
    devices-resource: mock/uniview-devices.json
  live:
    device-host: 39.185.236.176
    device-port: 10135
    username: guest
    password: "*Guest321"
    api-type: lapi
  nvr:
    library-path: /home/zkrh/videomid/lib

# 国标 GB28181：前期 mock 模拟下级，live 接真实 SIP（不用 RTSP）
gb28181:
  enabled: true
  data-source: mock
  prefer-for-biz-live: true
  upper:
    sip-id: "34020000002000000001"
    sip-domain: "3402000000"
    sip-ip: 119.3.161.125
    sip-port: 5060
    password: "12345678"
    register-expires: 3600
    heartbeat-interval: 30
  media:
    rtp-port-min: 30000
    rtp-port-max: 30500
    transport: UDP
  mock:
    auto-register: true
    preview-base-url: http://119.3.161.125:7094/live
  live:
    seed-from-db: true
    fallback-to-db-stream: true
    zlm-app: rtp
    enable-sip-stack: true
    send-invite-on-play: true
    auto-catalog-query: true
    bind-ip: 0.0.0.0
    local-ip: 119.3.161.125
    enable-digest-auth: true

# 【临时测试数据工具，用完删除 tools 包并去掉本段配置】
# 开启后：检测码流表 main 是否有推流，有则每隔 5 分钟录一段到「device_id」目录
testdata:
  main-stream-record:
    enabled: false
    output-dir: data/testdata-records
    interval-seconds: 300
    clip-seconds: 300
    ffmpeg-path: ffmpeg
    zlm-http-port: 8080

# 录像回放：ffprobe 读取 MP4 真实时长（endTime）
record:
  ffprobe-path: /usr/bin/ffprobe
  ffmpeg-path: ffmpeg
  probe-timeout-seconds: 5
  default-clip-seconds: 300
  # 按时间点截取片段：时间戳前后各 N 秒（默认 30，最大 150）
  default-clip-offset-seconds: 30
  max-clip-offset-seconds: 150
  clip-cache-dir: data/clip-cache
  clip-cache-max-age-hours: 24
  clip-timeout-seconds: 60
  clip-batch-max-size: 50

# 对外接口返回视频绝对地址时使用（可选；不配则按请求 host 自动生成）
open-api:
  public-base-url: http://119.3.161.125:7093

# JWT 登录配置（测试环境可关闭鉴权）
auth:
  enabled: false
  jwt-secret: "jizhi-video-mid-jwt-secret-change-me-32bytes!!"
  # token 有效期（秒），默认 24 小时
  token-ttl-seconds: 86400

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.jizhi.videomid: INFO
