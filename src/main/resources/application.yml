server:
  port: 8080

spring:
  application:
    name: video-mid
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/video_mid?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      connection-timeout: 30000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms

zlm:
  base-url: http://127.0.0.1:80
  secret: "035c73f7-bb6b-4889-a715-d9eb2d1925cc"

# JWT 登录配置
auth:
  jwt-secret: "jizhi-video-mid-jwt-secret-change-me-32bytes!!"
  # token 有效期（秒），默认 24 小时
  token-ttl-seconds: 86400

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.jizhi.videomid: INFO
